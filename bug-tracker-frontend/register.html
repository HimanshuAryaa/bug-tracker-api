    <style>
        /* New Style */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        /* Navbar */
        nav {
            display: flex;
            justify-content: flex-end;
            gap: 20px;
            padding: 18px 40px;
            background: rgba(0, 0, 0, 0.15);
            backdrop-filter: blur(10px);
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: 500;
            transition: .3s;
        }

        nav a:hover {
            color: #ffd369;
        }

        /* Main Title */
        h1 {
            text-align: center;
            color: white;
            margin-top: 30px;
            font-size: 42px;
            font-weight: 700;
        }

        /* Form Card */
        form {
            width: 420px;
            background: white;
            margin: 30px auto;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, .2);
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
        }

        /* Labels */
        label {
            display: block;
            margin-bottom: 6px;
            margin-top: 12px;
            font-weight: 600;
            color: #555;
        }

        /* Inputs */
        input,
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e6e6e6;
            border-radius: 8px;
            font-size: 15px;
            transition: .3s;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 8px rgba(102, 126, 234, .3);
        }

        /* Button */
        button {
            width: 100%;
            padding: 13px;
            margin-top: 20px;
            background: #667eea;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: .3s;
        }

        button:hover {
            background: #5a67d8;
            transform: translateY(-2px);
        }

        /* Validation Messages */
        #nameValidation,
        #emailValidation,
        #passwordValidation,
        #confirmPasswordValidation,
        #roleValidation {
            color: #e74c3c;
            font-size: 12px;
            min-height: 16px;
            margin-top: 4px;
        }

        /* Success/Error Message */
        #message {
            text-align: center;
            margin-top: 12px;
            font-size: 14px;
            min-height: 20px;
        }

        /* Footer Link */
        .login-link {
            text-align: center;
            margin-top: 15px;
            color: #666;
        }

        .login-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        /* Mobile */
        @media (max-width: 500px) {
            form {
                width: 90%;
                padding: 25px;
            }

            h1 {
                font-size: 32px;
            }
        }
    </style>
</head>

<body>
    <nav>
        <a href="index.html">Login</a>
        <a href="register.html">Register</a>
    </nav>
    <h1>🐞 Bug Tracker</h1>

    <form id="registerForm">

        <h2>Create Your Account</h2>

        <label>Name</label>
        <input type="text" id="name" placeholder="Enter your name" />
        <p id="nameValidation"></p>



        <label>Email</label>
        <input type="email" id="email" placeholder="Enter your email" />
        <p id="emailValidation"></p>



        <label>Password</label>
        <input type="password" id="password" placeholder="Enter your password" />
        <p id="passwordValidation"></p>



        <label>Confirm Password</label>
        <input type="password" id="confirmPassword" placeholder="Enter your password" />
        <p id="confirmPasswordValidation"></p>



        <label>Role</label>
        <select id="role">
            <option value="" selected>Select a role</option>
            <option value="manager">Manager</option>
            <option value="tester">Tester</option>
            <option value="developer">Developer</option>
        </select>
        <p id="roleValidation"></p>



        <p id="message"></p>
        <button type="button" id="submitBtn">Submit</button>

        <p class="login-link">
            Already have an account?
            <a href="index.html">Login</a>
        </p>


    </form>

    <script>
        document.getElementById("submitBtn").addEventListener("click", function () {
            document.getElementById("message").innerText = ""
            let nameValue = document.getElementById("name").value
            let emailValue = document.getElementById("email").value
            let passwordValue = document.getElementById("password").value
            let confirmPasswordValue = document.getElementById("confirmPassword").value
            let roleValue = document.getElementById("role").value
            let emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/


            if (!nameValue) {
                document.getElementById("nameValidation").innerText = "Name field cannot be empty"
                return
            } else {
                document.getElementById("nameValidation").innerText = ""
            }
            if (!emailValue) {
                document.getElementById("emailValidation").innerText = "Email field cannot be empty"
                return
            } else if (!emailRegex.test(emailValue)) {
                document.getElementById("emailValidation").innerText = "Invalid email format"
                return
            } else {
                document.getElementById("emailValidation").innerText = ""
            }
            if (!passwordValue) {
                document.getElementById("passwordValidation").innerText = "Password field cannot be empty"
                return
            } else if (passwordValue.length < 6) {
                document.getElementById("passwordValidation").innerText = "Password must be at least 6 characters"
                return
            } else {
                document.getElementById("passwordValidation").innerText = ""
            }
            if (!confirmPasswordValue) {
                document.getElementById("confirmPasswordValidation").innerText = "Confirm Password field cannot be empty"
                return
            } else if (passwordValue != confirmPasswordValue) {
                document.getElementById("confirmPasswordValidation").innerText = "Password mismatch"
                return
            } else {
                document.getElementById("confirmPasswordValidation").innerText = ""
            }
            if (!roleValue) {
                document.getElementById("roleValidation").innerText = "Please select a role"
                return
            } else {
                document.getElementById("roleValidation").innerText = ""
            }

            let btn = document.getElementById("submitBtn")
            btn.disabled = true
            btn.innerText = "Registering..."


            fetch("https://bug-tracker-api-kwyv.onrender.com/register", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    name: nameValue,
                    email: emailValue,
                    password: passwordValue,
                    role: roleValue
                })
            })
                .then(function (response) {
                    return response.json()
                })
                .then(function (data) {
                    if (data.message == "Successfully Registered User") {
                        document.getElementById("message").style.color = "#27ae60"
                        document.getElementById("message").innerText = "Registration Successful!"
                        console.log(data)
                        setTimeout(function () {
                            window.location.href = "index.html"
                        }, 2000)
                    }
                    else {
                        document.getElementById("message").innerText = data.error
                        console.log(data)
                    }
                    btn.disabled = false
                    btn.innerText = "Register"
                })
        })
    </script>

</body>
