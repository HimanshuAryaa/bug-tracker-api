    <style>
        /* New Style */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            flex-direction: column;
        }

        /* Navbar */
        nav {
            background: rgba(0, 0, 0, 0.15);
            backdrop-filter: blur(10px);
            padding: 18px 40px;
            display: flex;
            justify-content: flex-end;
            gap: 20px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: 500;
            transition: 0.3s;
        }

        nav a:hover {
            color: #ffd369;
        }

        /* Title */
        h1 {
            text-align: center;
            color: white;
            margin-top: 40px;
            font-size: 42px;
            font-weight: 700;
        }

        /* Form Card */
        form {
            width: 420px;
            margin: 30px auto;
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        label {
            display: block;
            margin-top: 12px;
            margin-bottom: 6px;
            font-weight: 600;
            color: #555;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e6e6e6;
            border-radius: 8px;
            font-size: 15px;
            transition: 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 8px rgba(102, 126, 234, 0.3);
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 18px;
            border: none;
            border-radius: 8px;
            background: #667eea;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #5a67d8;
            transform: translateY(-2px);
        }

        #message {
            text-align: center;
            margin-top: 12px;
            min-height: 20px;
            font-size: 14px;
        }

        #emailValidation,
        #passwordValidation {
            color: #e74c3c;
            font-size: 12px;
            margin-top: 4px;
            min-height: 16px;
        }

        /* Responsive */
        @media(max-width: 500px) {
            form {
                width: 90%;
                padding: 25px;
            }

            h1 {
                font-size: 32px;
            }
        }
    </style>
</head>

<body>
    <nav>
        <a href="index.html">Login</a>
        <a href="register.html">Register</a>
    </nav>

    <h1>🐞 Bug Tracker</h1>


    <form id="loginForm">

        <h2>Login</h2>

        <label>Email</label>
        <input type="email" id="email" placeholder="Enter your email" />
        <p id="emailValidation"></p>

        <label>Password</label>
        <input type="password" id="password" placeholder="Enter your password" />
        <p id="passwordValidation"></p>

        <p id="message"></p>
        <button type="button" id="loginBtn">Login</button>
        <p style="text-align:center; margin-top:15px;">
            Don't have an account?
            <a href="register.html">Register</a>
        </p>

    </form>

    <script>

        document.getElementById("loginBtn").addEventListener("click", function () {
            document.getElementById("message").innerText = ""
            let emailValue = document.getElementById("email").value
            let passwordValue = document.getElementById("password").value
            let emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/

            if (!emailValue) {
                document.getElementById("emailValidation").innerText = "Email field cannot be empty"
                return
            } else if (!emailRegex.test(emailValue)) {
                document.getElementById("emailValidation").innerText = "Invalid email format"
                return
            } else {
                document.getElementById("emailValidation").innerText = ""
            }
            if (!passwordValue) {
                document.getElementById("passwordValidation").innerText = "Password field cannot be empty"
                return
            } else {
                document.getElementById("passwordValidation").innerText = ""
            }
            let btn = document.getElementById("loginBtn")
            btn.disabled = true
            btn.innerText = "Logging in..."



            fetch("https://bug-tracker-api-kwyv.onrender.com/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    email: emailValue,
                    password: passwordValue
                })
            })
                .then(function (response) {
                    return response.json()
                })
                .then(function (data) {
                    if (data.Token) {
                        localStorage.setItem("token", data.Token)
                        localStorage.setItem("role", data.role)
                        localStorage.setItem("name", data.name)
                        localStorage.setItem("userId", data.id)
                        document.getElementById("message").style.color = "#27ae60"
                        document.getElementById("message").innerText = "Login Successfull!"
                        console.log(data)
                        setTimeout(function () {
                            window.location.href = "dashboard.html"
                        }, 1000)
                    }
                    else {
                        document.getElementById("message").innerText = data.Error
                        console.log(data)
                    }
                    btn.disabled = false
                    btn.innerText = "Login"
                })
        })


    </script>

</body>

</html>
